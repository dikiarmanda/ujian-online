services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ujian_online
      MYSQL_ROOT_PASSWORD: ujian
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7
    ports:
      - "6379:6379"
